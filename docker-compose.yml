version: "3.8"

networks:
  backend-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - backend-net

  db-usuario:
    image: postgres:15
    container_name: db-usuario
    environment:
      POSTGRES_DB: usuariodb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - usuario-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-medico:
    image: postgres:15
    container_name: db-medico
    environment:
      POSTGRES_DB: medicodb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5433:5432"
    volumes:
      - medico-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-agenda:
    image: postgres:15
    container_name: db-agenda
    environment:
      POSTGRES_DB: agendadb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5434:5432"
    volumes:
      - agenda-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-citas:
    image: postgres:15
    container_name: db-citas
    environment:
      POSTGRES_DB: citasdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5435:5432"
    volumes:
      - citas-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-paciente:
    image: postgres:15
    container_name: db-paciente
    environment:
      POSTGRES_DB: pacientedb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5436:5432"
    volumes:
      - paciente-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-pagos:
    image: postgres:15
    container_name: db-pagos
    environment:
      POSTGRES_DB: pagosdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5437:5432"
    volumes:
      - pagos-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-facturacion:
    image: postgres:15
    container_name: db-facturacion
    environment:
      POSTGRES_DB: facturaciondb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5438:5432"
    volumes:
      - facturacion-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-notificaciones:
    image: postgres:15
    container_name: db-notificaciones
    environment:
      POSTGRES_DB: notificacionesdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5439:5432"
    volumes:
      - notificaciones-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-cancelaciones:
    image: postgres:15
    container_name: db-cancelaciones
    environment:
      POSTGRES_DB: cancelacionesdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5440:5432"
    volumes:
      - cancelaciones-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  db-dashboard:
    image: postgres:15
    container_name: db-dashboard
    environment:
      POSTGRES_DB: dashboarddb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5441:5432"
    volumes:
      - dashboard-service-data:/var/lib/postgresql/data
    networks:
      - backend-net

  usuario-service:
    build:
      context: .
      dockerfile: usuario-service/Dockerfile
    container_name: usuario-service
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - db-usuario
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuario:5432/usuariodb
      SPRING_DATASOURCE_USERNAME: dev
      SPRING_DATASOURCE_PASSWORD: dev123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    networks:
      - backend-net

