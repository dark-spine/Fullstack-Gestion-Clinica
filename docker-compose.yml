version: "2.4"

networks:
  backend-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  db-usuario:
    image: postgres:15
    container_name: db-usuario
    restart: unless-stopped
    environment:
      POSTGRES_DB: usuariodb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - usuario-service-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d usuariodb || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-medico:
    image: postgres:15
    container_name: db-medico
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicodb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev123
